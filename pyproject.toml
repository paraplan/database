[project]
name = "vgpk_database"
version = "0.1.0"
description = "VGPK Database microservice"
authors = [{ name = "VodoGamer", email = "vodogamer@yandex.ru" }]
dependencies = ["fastapi>=0.111.0", "edgedb>=1.9.0", "uvicorn>=0.29.0"]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["ruff>=0.4.3", "pyright>=1.1.362", "pre-commit>=3.7.0"]

[tool.ruff]
lint.select = ["I", "E", "F", "B", "Q"]
line-length = 99

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
